on: [push]

jobs:
  main:
    runs-on: windows-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build app 
        working-directory: ./batisseurs
        run: flutter build windows
      - name: Archive app
        uses: actions/upload-artifact@v4
        with:
          name: batisseurs
          path: batisseurs/build/windows/x64/runner/Release
